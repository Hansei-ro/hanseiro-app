name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quality-check:
    name: 코드 품질 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 의존성 설치
        run: yarn install --frozen-lockfile

      - name: TypeScript 타입 체크
        run: yarn type-check

      - name: ESLint 검사
        run: yarn lint

      - name: Prettier 포맷 검사
        run: yarn prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

  build-test:
    name: 빌드 테스트
    runs-on: ubuntu-latest
    needs: quality-check
    timeout-minutes: 20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 의존성 설치
        run: yarn install --frozen-lockfile

      - name: Expo 빌드 테스트 (All Platforms)
        run: yarn build:check

      - name: 빌드 아티팩트 정리
        if: always()
        run: rm -rf .expo-test
